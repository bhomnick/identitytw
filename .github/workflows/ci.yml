name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  site:
    name: Django site
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install -r requirements.txt
      - name: Deployment checks
        run: python manage.py check --deploy
        env:
          USE_SSL: "true"
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Translations compile
        run: python manage.py compilemessages
      - name: Static files collect (catches broken asset references)
        run: python manage.py collectstatic --noinput
      - run: python manage.py test common --verbosity 2

  validator:
    name: Validator implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: php --version
      - run: ./validator/test.sh

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Bundle with wrangler (dry run)
        run: npm run check

  deploy-worker:
    name: Deploy Worker to Cloudflare
    needs: [validator, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            exit 0
          fi
          npx wrangler deploy
